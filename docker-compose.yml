version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: brand_rag_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped

  web:
    build: .
    container_name: brand_rag_studio
    ports:
      - "8501:8501"
    environment:
      - OLLAMA_HOST=http://ollama:11434
    volumes:
      - .:/app
      - hf_cache:/root/.cache/huggingface
    depends_on:
      - ollama
    restart: unless-stopped

volumes:
  ollama_models:
  hf_cache: